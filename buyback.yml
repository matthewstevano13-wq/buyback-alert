name: Buyback Alert

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub may delay it)
  workflow_dispatch:         # lets you run it manually from the Actions tab
    inputs:
      demo:
        description: "Send recent real buyback articles to test everything"
        type: boolean
        default: false

permissions:
  contents: write            # needed to save seen.json back to the repo

concurrency:
  group: buyback
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Scan news and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python buyback_alert.py ${{ inputs.demo && '--demo' || '--once' }}

      - name: Save seen.json (so alerts aren't repeated)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "update seen articles" && git push)
